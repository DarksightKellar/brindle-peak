  - All content lives in the JSON block <script id="board-data"> below. Edit the JSON, nothing else.
  - Card status: "todo" | "doing" | "done" | "director" (waiting on the director).
  - Keep exactly one card "doing" per worker. Move a card to "done" only after you have LOOKED at the
    result in the running game (http://127.0.0.1:5180) — tests alone never count.
  - Update "handoff.now" and "handoff.next" whenever you stop, and append to "log" (newest first).
  - Open it: http://127.0.0.1:5180/docs/board.html (vite dev server), or open the file directly.

<style>
  :root {

    --chip: #efe8da;
  }

      --accent: #e08a5f; --chip: #2f3342;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d24; --panel: #242733; --ink: #e8e6ef; --muted: #a09cab; --line: #383c4a;
    --accent: #e08a5f; --chip: #2f3342;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1500px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  h2 { font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .sub { color: var(--muted); margin-top: 4px; }
  main { max-width: 1500px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 16px; }
  .ctx { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { margin: 3px 0; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
  .handoff { border-left: 4px solid var(--accent); }
  .board { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  .col h3 { margin: 2px 4px 10px; font-size: 13px; display: flex; justify-content: space-between; }
  .col[data-s="todo"] h3 { color: var(--todo); } .col[data-s="doing"] h3 { color: var(--doing); }
  .col[data-s="done"] h3 { color: var(--done); } .col[data-s="director"] h3 { color: var(--director); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg); }
  .card summary { cursor: pointer; list-style: none; font-weight: 600; }
  .card summary::-webkit-details-marker { display: none; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .chip { font-size: 11px; background: var(--chip); border-radius: 999px; padding: 1px 7px; color: var(--muted); }
  .chip.g1 { color: #b0413e; } .chip.g2 { color: #b7791f; } .chip.g3 { color: #2b7a9b; }
  .chip.g4 { color: #6b6b6b; } .chip.g5 { color: #6b6b6b; } .chip.g6 { color: #7b4fb0; }
  .card p { margin: 6px 0 0; color: var(--ink); }
  .card .ev { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .filter button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .filter button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>

<script>
  const data = JSON.parse(document.getElementById('board-data').textContent);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const GROUPS = { 1: 'Story & quests', 2: 'Activities & keyboard', 3: 'Look & feel', 4: 'Small fixes', 5: 'Housekeeping', 6: 'Polish' };
  const COLS = [['todo', 'To do'], ['doing', 'Doing'], ['director', 'Waiting on director'], ['done', 'Done']];

  document.getElementById('updated').textContent = 'Last updated ' + data.updated;

  const h = document.getElementById('handoff');
  h.append(el('h2', null, 'Where we are'));
  h.append(el('p', null, '<b>Now:</b> ' + data.handoff.now));
  h.append(el('p', null, '<b>Next:</b> ' + data.handoff.next));
  h.append(el('p', null, '<b>Waiting on the director:</b> ' + data.handoff.director_waiting));

  const ctx = document.getElementById('ctx');
  for (const c of data.context) {
    const p = el('div', 'panel');
    p.append(el('h2', null, c.title));
    const ul = el('ul');
    for (const i of c.items) ul.append(el('li', null, i));
    p.append(ul);
    ctx.append(p);
  }

  let groupFilter = 0;
  const filter = document.getElementById('filter');
  const renderFilter = () => {
    filter.innerHTML = '';
    for (const [g, name] of [[0, 'All'], ...Object.entries(GROUPS)]) {
      const n = Number(g);
      const count = data.cards.filter(c => (n === 0 || c.group === n) && c.status !== 'done').length;
      const b = el('button', n === groupFilter ? 'on' : '', `${name} · ${count} open`);
      b.onclick = () => { groupFilter = n; renderFilter(); renderBoard(); };
      filter.append(b);
    }
  };
  const renderBoard = () => {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (const [s, label] of COLS) {
      const cards = data.cards.filter(c => c.status === s && (groupFilter === 0 || c.group === groupFilter));
      const col = el('div', 'col'); col.dataset.s = s;
      col.append(el('h3', null, `<span>${label}</span><span>${cards.length}</span>`));
      for (const c of cards) {
        const d = el('details', 'card');
        const sum = el('summary');
        const meta = el('div', 'meta');
        meta.append(el('span', 'chip g' + c.group, GROUPS[c.group]));
        meta.append(el('span', 'chip', c.id));
        sum.append(meta, document.createTextNode(c.title));
        d.append(sum);
        if (c.detail) d.append(el('p', null, c.detail));
        if (c.ev) d.append(el('p', 'ev', 'Evidence: ' + c.ev));
        if (c.notes) d.append(el('p', 'ev', 'Notes: ' + c.notes));
        col.append(d);
      }
      board.append(col);
    }
  };
  renderFilter(); renderBoard();

  const sc = document.getElementById('scores');
  sc.append(el('h2', null, 'Critic scores (stop at ≥ 8)'));
  if (!data.scores.length) sc.append(el('p', null, 'No critic rounds yet.'));
  else {
    const t = el('table');
    t.append(el('tr', null, '<th>Round</th><th>When</th><th>Art</th><th>Gameplay</th><th>Story</th><th>Overall</th><th>Top complaints</th>'));
    for (const r of data.scores) t.append(el('tr', null, `<td>${r.round}</td><td>${r.when}</td><td>${r.art}</td><td>${r.gameplay}</td><td>${r.story}</td><td><b>${r.overall}</b></td><td>${r.top}</td>`));
    sc.append(t);
  }

  const dec = document.getElementById('decisions');
  dec.append(el('h2', null, 'Decisions'));
  const dl = el('ul');
  for (const d of data.decisions) dl.append(el('li', null, `<b>${d.when}</b> — ${d.what}`));
  dec.append(dl);

  const log = document.getElementById('log');
  log.append(el('h2', null, 'Session log (newest first)'));
  const ll = el('ul');
  for (const l of data.log) ll.append(el('li', null, `<b>${l.when}</b> — ${l.what}`));
  log.append(ll);
</script>
