<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critic Round 8 Shots</title>
<style>
  :root { --bg: #f4f1ea; --card: #ffffff; --ink: #1d2230; --mute: #5d6474; --line: #ddd6c8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12151d; --card: #1b2030; --ink: #e8e6e1; --mute: #9aa1b2; --line: #2c3346; }
  }
  :root[data-theme="dark"] { --bg: #12151d; --card: #1b2030; --ink: #e8e6e1; --mute: #9aa1b2; --line: #2c3346; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 28px 0 10px; }
  .lede { color: var(--mute); margin: 0 0 8px; max-width: 900px; }
  .scores { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
  .score { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
  .score b { font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; cursor: zoom-in; }
  figcaption { font-size: 13px; margin: 6px 2px 0; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; }
  dialog img { max-width: 96vw; max-height: 92vh; display: block; }
  dialog::backdrop { background: rgba(0,0,0,.85); }
</style>
</head>
<body>
<main>
  <h1>The critic's screenshots, round 8</h1>
  <p class="lede">Taken by the critic while playing the story from a fresh start. Captions are the critic's points, in short. Click any image to enlarge.</p>
  <div class="scores">
    <div class="score">Art <b>7.5</b> <span>(was 8)</span></div>
    <div class="score">Gameplay <b>6.5</b> <span>(was 6)</span></div>
    <div class="score">Story <b>8</b> <span>(was 8.5)</span></div>
  </div>

  <h2>Problems</h2>
  <div class="grid">
    <figure><img src="24-photo-spot-unmarked-look-prompt.jpg" alt=""><figcaption>Aurora photo spot: nothing marks it; "LOOK" only appeared standing almost on it.</figcaption></figure>
    <figure><img src="44-skate-race-pip-stays-put.jpg" alt=""><figcaption>Skate "race": Pip stands still and balances; "Balance right" reads backwards; no result card seen.</figcaption></figure>
    <figure><img src="20-kettle-springs-empty-flats.jpg" alt=""><figcaption>Long, empty, low-contrast walks (Kettle Springs, Windscar slopes).</figcaption></figure>
    <figure><img src="28-map-not-tonight-no-fast-travel.jpg" alt=""><figcaption>Map refuses travel at night, while the HUD still says "M, E to go back".</figcaption></figure>
    <figure><img src="13-pinecone-toss-snowmen.jpg" alt=""><figcaption>Pinecone toss: the critic couldn't tell what "brightens"; 2 of 3 with no "so close".</figcaption></figure>
    <figure><img src="31-snowman-ball-hard-to-read.jpg" alt=""><figcaption>Snowman at night: the rolled ball hides behind Pip; the twig litter confuses.</figcaption></figure>
    <figure><img src="39-sled-run-finish-result.jpg" alt=""><figcaption>Sled: about 13 s; "1 of 5 rings, your fastest yet" praises a poor run.</figcaption></figure>
    <figure><img src="05-journal-map.jpg" alt=""><figcaption>Small text on the map and in the panels at the critic's window size.</figcaption></figure>
    <figure><img src="18-tuck-rope-bridge.jpg" alt=""><figcaption>Rope bridge rails shimmer as dotted lines from a distance.</figcaption></figure>
    <figure><img src="47-epilogue-card-home-and-the-valley-talking.jpg" alt=""><figcaption>Epilogue is a card, not a scene.</figcaption></figure>
  </div>

    <figure><img src="27-edda-farewell-sunset-mast.jpg" alt=""><figcaption>Edda at the mast at sunset.</figcaption></figure>

</main>
<dialog id="big"><img alt=""></dialog>
<script>
  const d = document.getElementById('big');
  document.querySelectorAll('figure img').forEach((img) => img.addEventListener('click', () => { d.querySelector('img').src = img.src; d.showModal(); }));
  d.addEventListener('click', () => d.close());
</script>
</body>
</html>
