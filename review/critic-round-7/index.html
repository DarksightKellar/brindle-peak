<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critic Round 7 Shots</title>
<style>
  :root { --bg: #f4f1ea; --card: #ffffff; --ink: #1d2230; --mute: #5d6474; --line: #ddd6c8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12151d; --card: #1b2030; --ink: #e8e6e1; --mute: #9aa1b2; --line: #2c3346; }
  }
  :root[data-theme="dark"] { --bg: #12151d; --card: #1b2030; --ink: #e8e6e1; --mute: #9aa1b2; --line: #2c3346; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 28px 0 10px; }
  .lede { color: var(--mute); margin: 0 0 8px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; cursor: zoom-in; }
  figcaption { font-size: 13px; margin: 6px 2px 0; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; }
  dialog img { max-width: 96vw; max-height: 92vh; display: block; }
  dialog::backdrop { background: rgba(0,0,0,.85); }
</style>
</head>
<body>
<main>
  <h1>The critic's screenshots, round 7</h1>
  <p class="lede">Taken by the critic while playing from a fresh start. Captions are the critic's points, in short. Click any image to enlarge.</p>

  <h2>Problems</h2>
  <div class="grid">
    <figure><img src="woodpile_start_log_hidden_by_shed.jpg" alt=""><figcaption>Woodpile: the swinging log is mostly hidden behind the shed.</figcaption></figure>
    <figure><img src="pinecone_toss_aim_dots_hidden_by_flagpole.jpg" alt=""><figcaption>Pinecone toss: faint aim dots, with the flagpole across them.</figcaption></figure>
    <figure><img src="kite_line_unreadable.jpg" alt=""><figcaption>Kite: A/D shows no visible effect on the kite.</figcaption></figure>
    <figure><img src="summit_whiteout_blue_on_blue.jpg" alt=""><figcaption>Summit: snow, sky and rocks all one light blue.</figcaption></figure>
    <figure><img src="dither_pillar_fills_screen.jpg" alt=""><figcaption>Near Windscar: a see-through rock fills the screen with a checkerboard.</figcaption></figure>
    <figure><img src="bug_camera_inside_slope_pip_sunk.jpg" alt=""><figcaption>Reported bug: view sunk into a steep slope, Pip half-buried.</figcaption></figure>
    <figure><img src="edda_dialogue_end_follow_posts.jpg" alt=""><figcaption>Edda: "Follow the lights down", but the critic saw long stretches of dark posts.</figcaption></figure>
  </div>

  <h2>What worked</h2>
  <div class="grid">
    <figure><img src="journal_quests_page.png" alt=""><figcaption>Quests page: distances, nearest, following.</figcaption></figure>
    <figure><img src="aurora_viewfinder.jpg" alt=""><figcaption>Aurora viewfinder.</figcaption></figure>
    <figure><img src="edda_mast_aurora_payoff.jpg" alt=""><figcaption>Edda, the mast and the aurora.</figcaption></figure>
    <figure><img src="photo_deer_polaroid.jpg" alt=""><figcaption>Deer photo and its polaroid.</figcaption></figure>
    <figure><img src="fishing_grayling.jpg" alt=""><figcaption>A grayling on the line.</figcaption></figure>
    <figure><img src="deer_trail_run_gate1.jpg" alt=""><figcaption>Deer Trail Run, the first gate.</figcaption></figure>
    <figure><img src="ending_card.jpg" alt=""><figcaption>The ending card.</figcaption></figure>
  </div>
</main>
<dialog id="big"><img alt=""></dialog>
<script>
  const d = document.getElementById('big');
  document.querySelectorAll('figure img').forEach((img) => img.addEventListener('click', () => { d.querySelector('img').src = img.src; d.showModal(); }));
  d.addEventListener('click', () => d.close());
</script>
</body>
</html>
